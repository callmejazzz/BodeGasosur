services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bodegasosur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bodegasosur}
      POSTGRES_DB: ${POSTGRES_DB:-bodegasosur}
    # Cada desarrollador decide POSTGRES_PORT; 5433 es el valor por omisión.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodegasosur -d bodegasosur"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
